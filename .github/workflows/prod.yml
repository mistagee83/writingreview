# Verziócímkére (v1.2.3) a prodra, KÉZI JÓVÁHAGYÁSSAL: a "prod" GitHub
# environment védelmi szabálya (Required reviewers) megállítja a deployt,
# amíg a tulajdonos jóvá nem hagyja. Csak a main-en lévő commit mehet.
# A pilot szándékosan nincs bekötve: ott csak kézi deploy van.
name: Prod deploy

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  teszt:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: teszt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A címkézett commit a main-en van?
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "A(z) $GITHUB_REF_NAME címke nem a main ágon lévő commitra mutat."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g firebase-tools
      - run: npm ci --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy (prod)
        run: node scripts/deploy.mjs prod --yes --only hosting,functions,firestore:rules,firestore:indexes,storage
