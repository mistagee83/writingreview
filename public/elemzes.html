<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="elz.oldalcim">WritingReview – Osztályszintű elemzés</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="WritingReview"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<div id="loading-screen" data-i18n="kozos.betoltes">Betöltés...</div>

<div class="topbar gated" id="topbar">
  <div class="brand">Writing<span>Review</span></div>
  <div class="topbar-right">
    <div class="user-info"><span class="csak-nagy" data-i18n="kozos.tanar_fejlec">👨‍🏫 Tanár &nbsp;|&nbsp;</span><strong id="user-name">–</strong></div>
    <button class="btn-logout" onclick="logout()" data-i18n="kozos.kilepes">Kilépés</button>
  </div>
</div>

<div class="layout gated" id="app-layout">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main narrow">
    <a class="vissza-link" href="feladatok.html" data-i18n="elz.vissza">← Feladatok</a>

    <div class="page-header">
      <h1 id="cim">–</h1>
      <p id="alcim">–</p>
    </div>

    <div class="msg" id="msg"></div>

    <div id="tartalom">
      <div class="empty-state bare"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<script type="module">
  import { t, nyelvNev } from './js/i18n.js';
  import { vedettOldal, esc, datum } from './js/guard.js';
  import { oldalsav } from './js/nav.js';
  import { uzenet, uzenetTorles, hibaSzoveg, gombVar, vagolapra } from './js/ui.js';
  import {
    db, functions, httpsCallable,
    collection, doc, getDoc, getDocs, query, where
  } from './js/firebase-config.js';

  const { user, admin } = await vedettOldal('tanar');
  oldalsav('feladatok.html', { admin });

  const feladatElemzes = httpsCallable(functions, 'feladatElemzes');

  const feladatId = new URLSearchParams(location.search).get('feladat');
  const tartalom = document.getElementById('tartalom');

  if (!feladatId) {
    document.getElementById('cim').textContent = t('elz.hianyzo_cim');
    tartalom.innerHTML =
      `<div class="empty-state"><p>${t('elz.hianyzo_leiras')}</p></div>`;
    throw new Error('nincs feladat id');
  }

  // ══════════════════════════════════════════
  // FELADAT + ÁLLAPOT
  // ══════════════════════════════════════════
  /** Végállapot hibával – hogy ne maradjon örökké pörgő karika. */
  function elakadt(szoveg, hiba) {
    if (hiba) console.error(hiba);
    tartalom.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <p>${esc(szoveg)}</p>
      <p class="halvany" style="margin-top:1rem;">
        ${hiba ? esc(hiba.message || String(hiba)) : ''}
      </p>
      <p style="margin-top:1.5rem;"><a class="btn-sm" href="feladatok.html">${t('elz.vissza_gomb')}</a></p>
    </div>`;
  }

  let fSnap;
  try {
    fSnap = await getDoc(doc(db, 'feladatok', feladatId));
  } catch (e) {
    elakadt(t('elz.feladat_hiba'), e);
    throw e;
  }
  if (!fSnap.exists()) {
    document.getElementById('cim').textContent = t('elz.nem_talalhato');
    elakadt(t('elz.nincs_feladat'));
    throw new Error('nincs feladat');
  }
  const feladat = fSnap.data();
  const r = feladat.rubrika || {};

  document.getElementById('cim').textContent = feladat.cim;

  // Hány beadás van, és mennyi van kiértékelve? Ebből tudja a tanár,
  // érdemes-e egyáltalán elemzést kérni.
  // A tanar_id szűrő NEM elhagyható: a Firestore list-szabálynál a
  // query-nek bizonyítania kell a jogosultságot. Csak feladat_id-vel
  // szűrve a szabály megtagadja, mert nem tudja garantálni, hogy minden
  // találat ehhez a tanárhoz tartozik.
  let bSnap;
  try {
    bSnap = await getDocs(query(
      collection(db, 'beadasok'),
      where('feladat_id', '==', feladatId),
      where('tanar_id', '==', user.uid)
    ));
  } catch (e) {
    elakadt(t('elz.beadas_hiba'), e);
    throw e;
  }
  const kiertekelt = bSnap.docs.filter(
    (d) => ['javitva', 'elkuldve'].includes(d.data().statusz)
  ).length;

  const kifejtosMod = r.mod === 'kifejtos';

  document.getElementById('alcim').textContent =
    [...(kifejtosMod ? [r.tantargy || t('diak.kifejtos_alap')] : [nyelvNev(r.nyelv || 'angol'), r.tipus, r.szint]),
     t('elz.alcim_beadas', { db: bSnap.size }), t('elz.alcim_kiertekelt', { db: kiertekelt })]
      .filter(Boolean).join(' · ');

  // ══════════════════════════════════════════
  // MEGJELENÍTÉS
  // ══════════════════════════════════════════
  const GYAKORISAG_OSZTALY = {
    'általános': 'feltoltve',
    'gyakori': 'javitva',
    'szórványos': 'inaktiv'
  };
  // Az AI kódszavai (magyar) → megjelenített szöveg
  const gyakorisagSzoveg = (g) => ({
    'általános':  t('elz.gyak_altalanos'),
    'gyakori':    t('elz.gyak_gyakori'),
    'szórványos': t('elz.gyak_szorvanyos')
  }[g] || g);

  function sav(szazalek) {
    const sz = Math.max(0, Math.min(100, Number(szazalek) || 0));
    const osztaly = sz < 50 ? 'baj' : (sz < 75 ? 'kozepes' : 'jo');
    return `<div class="sav"><div class="sav-kitolt ${osztaly}" style="width:${sz}%"></div></div>`;
  }

  // ── KIFEJTŐS DOLGOZAT ──
  // A számokat (kérdésenkénti átlag, elemenkénti hiányarány) a kód
  // számolta, nem az AI. Az elemeknél a sáv a HIÁNY aránya, mindig
  // pirossal – ugyanazt mutatja, amit a mellette álló szám.
  function hianySav(szazalek) {
    const sz = Math.max(0, Math.min(100, Number(szazalek) || 0));
    return `<div class="sav"><div class="sav-kitolt baj" style="width:${sz}%"></div></div>`;
  }
  const kategoriaCimke = (k) => ({
    hianyzo_elem:      t('elz.kat_hianyzo_elem'),
    tartalmi_tevedes:  t('elz.kat_tartalmi_tevedes'),
    pontatlan_fogalom: t('elz.kat_pontatlan_fogalom'),
    sorrend:           t('elz.kat_sorrend'),
    hianyos_kifejtes:  t('elz.kat_hianyos_kifejtes')
  }[k] || k);

  function elemSor(el) {
    const hiany = el.hiany_szazalek ?? 0;
    const reszletek = [
      el.hianyzik ? t('elz.reszlet_hianyzik', { db: el.hianyzik }) : null,
      el.teves ? t('elz.reszlet_teves', { db: el.teves }) : null,
      el.reszben ? t('elz.reszlet_reszben', { db: el.reszben }) : null,
      el.rossz_helyen ? t('elz.reszlet_rossz_helyen', { db: el.rossz_helyen }) : null
    ].filter(Boolean).join(', ');
    return `
      <div class="sav-sor">
        <div class="sav-cimke">${esc(el.allitas)}${el.ag ? ` <span class="halvany">(${esc(el.ag)})</span>` : ''}</div>
        ${hianySav(hiany)}
        <div class="sav-ertek">${el.db ? t('elz.hianyzik_diaknal', { ossz: el.hianyzik + el.teves, db: el.db }) : t('elz.senki')}</div>
      </div>
      ${reszletek ? `<p class="halvany elem-reszlet">${esc(reszletek)}</p>` : ''}`;
  }

  function kifejtosPanelek(e) {
    return `
      <div class="panel">
        <div class="panel-header"><h2>${t('vj.kerdesenkent_cim')}</h2></div>
        <div class="panel-body">
          <p class="halvany">${t('elz.kerdesenkent_leiras')}</p>
          ${(e.kerdesek || []).map((k) => `
            <details class="kerdes-reszlet">
              <summary>
                <div class="sav-sor">
                  <div class="sav-cimke"><strong>${esc(k.sorszam)}.</strong> ${esc(k.szoveg || '')}</div>
                  ${sav(k.szazalek)}
                  <div class="sav-ertek">${k.atlag_pont ?? '–'}/${k.max_pont} · ${k.szazalek ?? '–'}%</div>
                </div>
              </summary>
              <div class="kerdes-elemek">${(k.elemek || []).map(elemSor).join('')}</div>
            </details>`).join('') || `<p class="halvany">${t('elz.nincs_adat')}</p>`}
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>${t('elz.kihagyott_cim')}</h2></div>
        <div class="panel-body">
          ${(e.kihagyott || []).length ? `
            <p class="halvany">${t('elz.kihagyott_leiras')}</p>
            ${e.kihagyott.map((el) => `
              <div class="sav-sor">
                <div class="sav-cimke"><span class="badge inaktiv">${esc(el.sorszam)}.</span> ${esc(el.allitas)}</div>
                ${hianySav(el.hiany_szazalek)}
                <div class="sav-ertek">${el.hianyzik + el.teves}/${el.db} · ${el.hiany_szazalek}%</div>
              </div>`).join('')}`
            : `<p class="halvany">${t('elz.nincs_kihagyott')}</p>`}
        </div>
      </div>`;
  }

  function rajzol(e) {
    tartalom.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">${t('elz.stat_atlag')}</div>
          <div class="stat-value accent">${e.atlag_szazalek != null ? e.atlag_szazalek + '%' : '–'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">${t('elz.stat_ertekelt')}</div>
          <div class="stat-value">${e.ertekelt_db}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">${t('elz.stat_nehez')}</div>
          <div class="stat-value">${e.olvashatosag?.gyenge ?? 0}</div>
        </div>
      </div>

      ${e.ertekelt_db < 3 ? `
        <div class="msg error" style="display:block;">
          ${t('elz.keves_dolgozat', { db: e.ertekelt_db })}
        </div>` : ''}

      ${e.mod === 'kifejtos' ? kifejtosPanelek(e) : `
      <div class="panel">
        <div class="panel-header"><h2>${t('elz.szempontonkent_cim')}</h2></div>
        <div class="panel-body">
          <p class="halvany">${t('elz.szempont_leiras')}</p>
          ${(e.szempontok || []).map((sz) => `
            <div class="sav-sor">
              <div class="sav-cimke">${esc(sz.kulcs)}</div>
              ${sav(sz.szazalek)}
              <div class="sav-ertek">${sz.atlag_pont}/${sz.max_pont} · ${sz.szazalek ?? '–'}%</div>
            </div>`).join('') || `<p class="halvany">${t('elz.nincs_adat')}</p>`}
        </div>
      </div>`}

      <div class="panel">
        <div class="panel-header"><h2>${t('elz.osszegzes_cim')}</h2></div>
        <div class="panel-body">
          <div class="visszajelzes-szoveg">${esc(e.osszegzes).replace(/\n/g, '<br/>')}</div>
        </div>
      </div>

      ${(e.tipushibak || []).length ? `
      <div class="panel">
        <div class="panel-header"><h2>${e.mod === 'kifejtos' ? t('elz.kozos_hianyok_cim') : t('elz.tipushibak_cim')}</h2></div>
        <div class="panel-body">
          <p class="halvany">
            ${e.mod === 'kifejtos' ? t('elz.kozos_leiras') : t('elz.tipus_leiras')}
          </p>
          ${e.tipushibak.map((h) => `
            <div class="elem-kartya">
              <h4>
                ${esc(h.cim)}
                <span class="badge ${GYAKORISAG_OSZTALY[h.gyakorisag] || 'inaktiv'}">${esc(gyakorisagSzoveg(h.gyakorisag))}</span>
                <span class="badge inaktiv">${esc(kategoriaCimke(h.kategoria))}</span>
              </h4>
              <p>${esc(h.magyarazat)}</p>
              ${(h.peldak || []).length ? `
                <ul class="lista-pontok">${h.peldak.map((x) => `<li><em>${esc(x)}</em></li>`).join('')}</ul>` : ''}
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${(e.gyakorlatok || []).length ? `
      <div class="panel">
        <div class="panel-header"><h2>${t('elz.gyakorlatok_cim')}</h2></div>
        <div class="panel-body">
          ${e.gyakorlatok.map((g) => `
            <div class="elem-kartya">
              <h4>${esc(g.cim)} <span class="badge inaktiv">${t('elz.perc', { db: esc(g.idotartam_perc) })}</span></h4>
              <p class="halvany"><strong>${t('elz.cel')}</strong> ${esc(g.cel)}</p>
              <p>${esc(g.leiras)}</p>
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${e.generalo_prompt ? `
      <div class="panel">
        <div class="panel-header">
          <h2>${t('elz.prompt_cim')}</h2>
          <button class="btn-sm" id="btn-prompt-masol">${t('elz.masolas')}</button>
        </div>
        <div class="panel-body">
          <p class="halvany">${t('elz.prompt_leiras')}</p>
          <pre class="atirat" id="generalo-prompt">${esc(e.generalo_prompt)}</pre>
        </div>
      </div>` : ''}

      <div class="gomb-sor">
        <button class="btn-sm" id="btn-ujra">${t('elz.ujrafuttat')}</button>
      </div>
      <p class="halvany" style="margin-top:0.75rem;">
        ${t('elz.keszult', { datum: datum(e.generalva), model: e.model ? ` · ${esc(e.model)}` : '' })}
      </p>`;

    const masol = document.getElementById('btn-prompt-masol');
    if (masol) {
      masol.addEventListener('click', () =>
        vagolapra(document.getElementById('generalo-prompt').textContent, masol));
    }
    document.getElementById('btn-ujra').addEventListener('click', (ev) => keszit(ev.currentTarget));
  }

  function meghivo() {
    tartalom.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <p>
          ${t('elz.nincs_elemzes')}<br/>
          ${kifejtosMod ? t('elz.meghivo_kifejtos') : t('elz.meghivo_fogalmazas')}
        </p>
        ${kiertekelt === 0
          ? `<p class="halvany" style="margin-top:1rem;">${t('elz.nincs_kiertekelt')}</p>`
          : `<p style="margin-top:1.5rem;">
               <button class="btn-primary" id="btn-keszit">${t('elz.keszit_gomb')}</button>
             </p>
             ${kiertekelt < 3
               ? `<p class="halvany" style="margin-top:0.75rem;">${t('elz.keves_kiertekelt', { db: kiertekelt })}</p>`
               : ''}`}
      </div>`;

    const btn = document.getElementById('btn-keszit');
    if (btn) btn.addEventListener('click', (ev) => keszit(ev.currentTarget));
  }

  // ══════════════════════════════════════════
  // GENERÁLÁS
  // ══════════════════════════════════════════
  async function keszit(gomb) {
    uzenetTorles('msg');
    const vissza = gombVar(gomb, t('elz.ai_dolgozik'));
    try {
      const { data } = await feladatElemzes({ feladatId });
      rajzol(data);
    } catch (e) {
      // A szerver a csomag-zárat csomag_alap_kell kóddal jelzi: ilyenkor a barátságos kártya jön, nem hibaüzenet.
      if (e?.details?.kod === 'csomag_alap_kell') {
        zarKartya();
        return;
      }
      uzenet('msg', hibaSzoveg(e));
      vissza();
    }
  }

  function zarKartya() {
    tartalom.innerHTML = `
      <div class="panel">
        <div class="panel-header"><h2>${t('elz.zar_cim')}</h2></div>
        <div class="panel-body">
          <p>${t('elz.zar_szoveg')}</p>
          <div class="gomb-sor">
            <a class="btn-primary" href="tanar.html#csomag-panel">${t('elz.zar_gomb')}</a>
          </div>
        </div>
      </div>`;
  }

  // ══════════════════════════════════════════
  // MENTETT ELEMZÉS BETÖLTÉSE
  // ══════════════════════════════════════════
  try {
    const eSnap = await getDoc(doc(db, 'feladatok', feladatId, 'elemzes', 'osszegzes'));
    if (eSnap.exists()) rajzol(eSnap.data());
    else meghivo();
  } catch (e) {
    console.error(e);
    meghivo();
  }
</script>
</body>
</html>
