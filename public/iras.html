<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="iras.oldalcim">WritingReview – Feladat</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="diak-oldal">

<!-- A DIÁK OLDALA A FELADATLINKEN. Belépés nincs: a link tokenje a jogosultság
     (iras.html?k=<token>). Minden adat Cloud Functionön át jön és megy
     (linkAdatok, linkBeadas); a Firestore-hoz a diák nem fér hozzá, és az oldal
     nem indít AI-hívást – az értékelést a tanár indítja. -->

<div class="topbar">
  <div class="brand">Writing<span>Review</span></div>
  <div class="topbar-right" data-nyelvvalaszto></div>
</div>

<main class="main narrow diak-main">
  <div class="msg" id="msg"></div>

  <div id="tartalom">
    <div class="empty-state bare"><div class="spinner"></div></div>
  </div>
</main>

<script type="module">
  import { t, nyelvNev, datumSzoveg } from './js/i18n.js';
  // Csak az escape-függvény kell innen; a védett oldal kapuja (vedettOldal) itt NEM fut.
  import { esc } from './js/guard.js';
  import { uzenet, uzenetTorles, hibaSzoveg, gombVar, vagolapra } from './js/ui.js';
  import { jelzesFigyelo, szoszam, SZOVEG_MAX } from './js/iras-jelzes.js';
  import { nagyTorles, megorzendo, visszaallithato, bekezdesSzam, szoSav, taroloMukodik } from './js/iras-szerkeszto.js';
  import { qrSvg } from './js/megosztas.js';
  import { visszajelzesHtml, beadottSzovegHtml } from './js/visszajelzes-nezet.js';
  import { functions, httpsCallable, appCheckInditas } from './js/firebase-config.js';
  import { APP_CHECK_KULCS } from './js/kornyezet.js';

  // App Check (8e): a hívások előtt, ha a környezetben van kulcs. Hibánál az oldal megy tovább: ha a szerver
  // megköveteli, a hívás érthető hibát ad, ha nem, semmi nem változik.
  await appCheckInditas(APP_CHECK_KULCS).catch((e) => console.error('App Check:', e));

  const linkAdatok = httpsCallable(functions, 'linkAdatok');
  const linkBeadas = httpsCallable(functions, 'linkBeadas');
  const diakVisszajelzes = httpsCallable(functions, 'diakVisszajelzes');

  const token = new URLSearchParams(location.search).get('k') || '';
  const tartalom = document.getElementById('tartalom');

  // A böngésző tárolója hibatűrően (privát ablakban nincs): a piszkozat és a nyugta itt marad,
  // hogy egy véletlen újratöltés ne vigye el a szöveget, és a beadás után a nyugta újra látsszon.
  const tarol = (fn) => { try { return fn(localStorage); } catch (_) { return null; } };
  const PISZKOZAT = `wr-iras-piszkozat-${token}`;
  const BECENEV = `wr-iras-becenev-${token}`;
  const NYUGTA = `wr-iras-nyugta-${token}`;
  const JELZES = `wr-iras-jelzes-${token}`;
  const TOROLT = `wr-iras-torolt-${token}`;   // törlésvédelem: a nagy törlés előtti változat
  const BETUMERET = 'wr-iras-nagybetu';        // íróüzem: nagyobb betű (minden feladatra érvényes)

  function uzenetLap(ikon, szoveg) {
    tartalom.innerHTML = `<div class="panel"><div class="panel-body"><div class="empty-state bare">
      <div class="empty-icon">${ikon}</div><p>${esc(szoveg)}</p></div></div></div>`;
  }

  // ══════════════════════════════════════════
  // NYUGTA: a diák saját visszajelzés-linkje
  // ══════════════════════════════════════════
  // A nyugta a diák saját linkjét mutatja (kattintható, QR-ral és másolással az eszközváltáshoz), és – ha
  // `ellenoriz` – megkérdezi a szervert, jóváhagyta-e már a tanár: ha igen, itt is megjelenik a visszajelzés.
  // Közvetlenül a beadás után nem kérdez (akkor biztosan várakozik); folyamatos lekérdezés nincs, csak a gomb.
  function nyugtaMutat(nyugta, { ellenoriz = false } = {}) {
    const url = `${location.origin}/visszajelzes.html?d=${encodeURIComponent(nyugta.diakToken)}`;
    const lejar = datumSzoveg(new Date(nyugta.diaklinkLejar));
    const linkBlokk = `
      <div class="link-megosztas" style="margin-top:1rem;">
        <div class="link-qr">${qrSvg(url, { cim: t('iras.nyugta_qr_alt') })}</div>
        <div class="link-adatok">
          <a class="btn-primary" id="btn-megnyit" href="${esc(url)}">${t('iras.nyugta_megnyit')}</a>
          <label for="diaklink" style="margin-top:1rem;">${t('iras.nyugta_link')}</label>
          <div class="code-input-row">
            <input type="text" id="diaklink" readonly value="${esc(url)}" />
            <button class="btn-sm" id="btn-masol">${t('iras.masolas')}</button>
          </div>
          <p class="iras-figyelmeztetes" style="margin-top:1rem;">${t('iras.nyugta_mentsd', { datum: esc(lejar) })}</p>
        </div>
      </div>`;
    const masolasBekot = () => document.getElementById('btn-masol').addEventListener('click', (e) =>
      vagolapra(document.getElementById('diaklink').value, e.currentTarget));
    // A beadott szöveg: a beadáskor a nyugtába mentett példány, vagy (régebbi nyugtánál) a szerver válasza.
    let beadottSzoveg = typeof nyugta.szoveg === 'string' ? nyugta.szoveg : '';

    function varakozoNyugta(allapotSzoveg) {
      tartalom.innerHTML = `
        <div class="panel">
          <div class="panel-header"><h2>${t('iras.nyugta_cim')}</h2></div>
          <div class="panel-body">
            <p>${t('iras.nyugta_leiras', { becenev: esc(nyugta.becenev || '') })}</p>
            <div class="code-input-row" style="margin-top:1rem; align-items:center;">
              <p class="halvany" id="nyugta-allapot" style="margin:0; flex:1;">${esc(allapotSzoveg)}</p>
              <button class="btn-sm" id="btn-frissit">${t('iras.nyugta_frissit')}</button>
            </div>
            ${linkBlokk}
          </div>
        </div>
        ${beadottSzoveg ? beadottSzovegHtml(beadottSzoveg) : ''}`;
      masolasBekot();
      document.getElementById('btn-frissit').addEventListener('click', () => allapotKerdez());
    }

    function keszNyugta(adat) {
      tartalom.innerHTML = `${visszajelzesHtml(adat)}
        <div class="panel">
          <div class="panel-header"><h2>${t('iras.nyugta_link')}</h2></div>
          <div class="panel-body">${linkBlokk}</div>
        </div>`;
      masolasBekot();
    }

    async function allapotKerdez() {
      const gomb = document.getElementById('btn-frissit');
      if (gomb) gomb.disabled = true;
      const allapot = document.getElementById('nyugta-allapot');
      if (allapot) allapot.textContent = t('iras.nyugta_ellenorzes');
      let adat;
      try {
        ({ data: adat } = await diakVisszajelzes({ token: nyugta.diakToken }));
      } catch (e) {
        // Hálózati vagy szerverhiba: a link marad, a diák később újra próbálhatja.
        varakozoNyugta(e?.details?.kod === 'diaklink_ervenytelen' ? t('vj.ervenytelen') : hibaSzoveg(e));
        return;
      }
      if (typeof adat.szoveg === 'string' && adat.szoveg) beadottSzoveg = adat.szoveg;
      if (adat.allapot === 'kesz') keszNyugta(adat);
      else if (adat.allapot === 'lejart') uzenetLap('⏰', t('vj.lejart'));
      else varakozoNyugta(t('iras.nyugta_varakozik'));
    }

    varakozoNyugta(t('iras.nyugta_varakozik'));
    if (ellenoriz) allapotKerdez();
  }

  const mentettNyugta = tarol((ls) => JSON.parse(ls.getItem(NYUGTA) || 'null'));
  if (mentettNyugta?.diakToken) {
    nyugtaMutat(mentettNyugta, { ellenoriz: true });
  } else {
    await betolt();
  }

  // ══════════════════════════════════════════
  // A FELADAT ÉS AZ ÍRÓFELÜLET
  // ══════════════════════════════════════════
  async function betolt() {
    let adat;
    try {
      ({ data: adat } = await linkAdatok({ token }));
    } catch (e) {
      uzenetLap('⚠️', e?.details?.kod === 'link_ervenytelen' ? t('iras.ervenytelen') : hibaSzoveg(e));
      return;
    }
    if (adat.allapot !== 'aktiv') {
      const szoveg = { lejart: t('iras.lejart'), lezarva: t('iras.lezarva'), betelt: t('iras.betelt') }[adat.allapot] || t('iras.ervenytelen');
      uzenetLap('⏰', szoveg);
      return;
    }
    feluletRajzol(adat);
  }

  function szoszamSzoveg(n, min, max) {
    return min && max ? (n < min || n > max ? t('iras.szoszam_elvart', { n, min, max }) : t('iras.szoszam', { n }))
      : min && n < min ? t('iras.szoszam_legalabb', { n, min })
      : max && n > max ? t('iras.szoszam_legfeljebb', { n, max })
      : t('iras.szoszam', { n });
  }

  function feluletRajzol(adat) {
    const f = adat.feladat;
    const szoKorlat = f.min_szo && f.max_szo ? t('iras.szo_tartomany', { min: f.min_szo, max: f.max_szo })
      : f.min_szo ? t('iras.szo_legalabb', { min: f.min_szo })
      : f.max_szo ? t('iras.szo_legfeljebb', { max: f.max_szo }) : '';
    document.title = `${adat.cim} – WritingReview`;
    const feladatTorzs = `
          ${f.leiras ? `<p class="feladat-leiras">${esc(f.leiras)}</p>` : `<p class="halvany">${t('iras.nincs_leiras')}</p>`}
          ${f.szempontok.length ? `
            <table class="tabla" style="margin-top:1rem;">
              <thead><tr><th>${t('iras.szempont')}</th><th>${t('iras.pont')}</th></tr></thead>
              <tbody>${f.szempontok.map((sz) => `<tr><td>${esc(sz.cim)}</td><td>${esc(sz.suly)}</td></tr>`).join('')}</tbody>
            </table>` : ''}`;

    tartalom.innerHTML = `
      <div class="page-header">
        <h1>${esc(adat.cim)}</h1>
        <p>${[nyelvNev(f.nyelv), szoKorlat].filter(Boolean).map(esc).join(' · ')}</p>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>${t('iras.feladat_cim')}</h2></div>
        <div class="panel-body">${feladatTorzs}</div>
      </div>

      <!-- Íróüzem: ugyanez a panel tölti ki a képernyőt (iro-uzem osztály); a szövegmező ugyanaz marad,
           így a beillesztés tiltása és a jelzések változatlanul működnek. -->
      <div class="panel iras-panel" id="iras-panel">
        <div class="panel-header">
          <h2>${t('iras.iras_cim')}</h2>
          <button type="button" class="btn-sm" id="btn-iro" aria-pressed="false">${t('iras.iro_be')}</button>
        </div>
        <div class="panel-body">
          <div class="form-group iro-rejt">
            <label for="becenev">${t('iras.becenev')}</label>
            <input type="text" id="becenev" maxlength="30" autocomplete="off" spellcheck="false"
                   placeholder="${esc(t('iras.becenev_pelda'))}" />
            <small>${t('iras.becenev_tipp')}${adat.csoportos ? ` <strong>${t('iras.becenev_csoport')}</strong>` : ''}</small>
          </div>
          <!-- A diák ELŐRE látja, mit jelzünk a tanárnak (átláthatóság). -->
          <p class="halvany iras-figyelmeztetes iro-rejt">${t('iras.figyelmeztetes')}</p>
          <p class="iras-figyelmeztetes" id="mentes-hiba" hidden>${t('iras.mentes_nem_megy')}</p>
          <div class="iras-eszkozsor">
            <button type="button" class="btn-sm" id="btn-vissza">${t('iras.visszavonas')}</button>
            <button type="button" class="btn-sm iro-csak" id="btn-feladat" aria-expanded="false" aria-controls="iro-feladat">${t('iras.iro_feladat')}</button>
            <button type="button" class="btn-sm iro-csak" id="btn-betu" aria-pressed="false">${t('iras.iro_betu')}</button>
            <span class="mentes-allapot" id="mentes-allapot" aria-live="polite"></span>
          </div>
          <div class="iro-feladat" id="iro-feladat" hidden>${feladatTorzs}</div>
          <div class="torles-sav" id="torles-sav" role="alert" hidden>
            <span>${t('iras.torles_kerdes')}</span>
            <button type="button" class="btn-sm btn-primary" id="btn-visszaallit">${t('iras.torles_visszaallit')}</button>
            <button type="button" class="btn-sm" id="btn-torles-elvet">${t('iras.torles_elvet')}</button>
          </div>
          <!-- A helyesírás-javítás és az automatikus nyelvhelyesség alapból KI van kapcsolva: a szöveget a
               diák saját tudása szerint kell értékelni. A böngésző helyesírás-ellenőrzését a tanár
               feladatonként engedheti meg (rubrika.helyesiras_engedett); a nyelvhelyesség-bővítmények
               (Grammarly) mindig tiltva. -->
          <textarea id="szoveg" class="iras-szoveg" rows="14"
                    spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
                    data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"
                    aria-label="${esc(t('iras.szoveg_aria'))}" placeholder="${esc(t('iras.szoveg_pelda'))}"></textarea>
          <div class="szo-sav" id="szo-sav" hidden><div class="szo-sav-tolt" id="szo-sav-tolt"></div></div>
          <div class="szamlalo"><span id="szamlalo" aria-live="polite"></span> · <span id="bekezdesek"></span></div>
          <div class="msg" id="iras-msg"></div>
          <div class="gomb-sor iro-rejt">
            <button class="btn-primary" id="btn-bead">${t('iras.bead_gomb')}</button>
          </div>
          <p class="halvany iro-rejt" style="margin-top:0.75rem;">${t('iras.vegleges')}</p>
        </div>
      </div>`;

    const mezo = document.getElementById('szoveg');
    const becenevMezo = document.getElementById('becenev');
    const szamlalo = document.getElementById('szamlalo');
    const NYELV_KOD = { angol: 'en', 'német': 'de', francia: 'fr', spanyol: 'es', olasz: 'it', orosz: 'ru', latin: 'la', magyar: 'hu' };
    mezo.lang = NYELV_KOD[f.nyelv] || '';
    mezo.value = tarol((ls) => ls.getItem(PISZKOZAT)) || '';
    becenevMezo.value = tarol((ls) => ls.getItem(BECENEV)) || '';

    // A beillesztés TILTOTT (vágólap, húzás, telefonos billentyűzet-vágólap); a kísérlet jelzés a tanárnak.
    const figyelo = jelzesFigyelo(mezo, { kulcs: JELZES, tiltas: true });
    if (f.helyesiras) {
      mezo.spellcheck = true;
      mezo.setAttribute('autocorrect', 'on');
      mezo.setAttribute('autocapitalize', 'sentences');
    }
    const bekezdesek = document.getElementById('bekezdesek');
    const savElem = document.getElementById('szo-sav');
    const savTolt = document.getElementById('szo-sav-tolt');
    const szamlaloFrissit = () => {
      const n = szoszam(mezo.value);
      szamlalo.textContent = szoszamSzoveg(n, f.min_szo, f.max_szo);
      bekezdesek.textContent = t('iras.bekezdes', { n: bekezdesSzam(mezo.value) });
      const sav = szoSav(n, f.min_szo, f.max_szo);
      savElem.hidden = !sav;
      if (sav) {
        savTolt.style.width = `${sav.szazalek}%`;
        savElem.dataset.allapot = sav.allapot;
      }
    };
    szamlaloFrissit();

    // ── Mentés, látható állapottal ──
    // A diák lássa, hogy a szövege megvan. Ha a böngésző nem tud menteni (privát ablak), azt mondjuk ki,
    // és a lap bezárása előtt a böngésző rákérdez.
    const mentesAllapot = document.getElementById('mentes-allapot');
    const mentesHiba = document.getElementById('mentes-hiba');
    const tudMenteni = tarol((ls) => taroloMukodik(ls)) === true;
    const oraPerc = () => new Date().toLocaleTimeString(document.documentElement.lang || undefined, { hour: '2-digit', minute: '2-digit' });
    function allapotJelez(allapot) {
      mentesAllapot.dataset.allapot = allapot;
      mentesAllapot.textContent = allapot === 'mentes' ? t('iras.mentes_folyamat')
        : allapot === 'mentve' ? t('iras.mentve', { ido: oraPerc() })
        : t('iras.mentes_hiba');
      mentesHiba.hidden = allapot !== 'hiba';
    }
    let mentesIdo = null;
    function ment() {
      clearTimeout(mentesIdo);
      mentesIdo = null;
      const ok = tarol((ls) => { ls.setItem(PISZKOZAT, mezo.value); return true; }) === true;
      allapotJelez(ok ? 'mentve' : 'hiba');
    }
    const kesleltetettMentes = () => {
      if (mentesAllapot.dataset.allapot !== 'hiba') allapotJelez('mentes');
      clearTimeout(mentesIdo);
      mentesIdo = setTimeout(ment, 400);
    };
    // Bezáráskor, másik lapra váltáskor azonnal mentünk (a telefon a háttérben lévő lapot bezárhatja).
    const azonnalMent = () => { if (mentesIdo !== null) ment(); };
    addEventListener('pagehide', azonnalMent);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') azonnalMent(); });
    function bezarasElott(e) {
      if (mentesAllapot.dataset.allapot === 'hiba' && mezo.value.trim()) { e.preventDefault(); e.returnValue = ''; }
    }
    addEventListener('beforeunload', bezarasElott);
    if (tudMenteni) { if (mezo.value) allapotJelez('mentve'); } else allapotJelez('hiba');

    // ── Törlésvédelem ──
    // Ha egy bevitellel sok szöveg tűnik el (kijelölés + törlés), az előző változatot megőrizzük,
    // és a sáv felajánlja a visszaállítást – újratöltés után is, amíg a diák el nem veti.
    const torlesSav = document.getElementById('torles-sav');
    let orzott = tarol((ls) => ls.getItem(TOROLT)) || '';
    let elozo = mezo.value;
    const savFrissit = () => { torlesSav.hidden = !visszaallithato(orzott, mezo.value); };
    function orzottTorol() {
      orzott = '';
      tarol((ls) => ls.removeItem(TOROLT));
      savFrissit();
    }
    function visszaallit() {
      mezo.value = orzott;
      figyelo.szinkron();    // a saját szövege: nem beillesztés, nem nagy betoldás
      elozo = mezo.value;
      orzottTorol();
      szamlaloFrissit();
      ment();
      mezo.focus();
    }
    savFrissit();
    document.getElementById('btn-visszaallit').addEventListener('click', visszaallit);
    document.getElementById('btn-torles-elvet').addEventListener('click', () => { orzottTorol(); mezo.focus(); });

    mezo.addEventListener('input', (e) => {
      const visszavonas = typeof e.inputType === 'string' && e.inputType.startsWith('history');
      if (!visszavonas && nagyTorles(elozo, mezo.value)) {
        orzott = megorzendo(orzott, elozo);
        tarol((ls) => ls.setItem(TOROLT, orzott));
      }
      elozo = mezo.value;
      savFrissit();
      szamlaloFrissit();
      kesleltetettMentes();
    });
    becenevMezo.addEventListener('input', () => tarol((ls) => ls.setItem(BECENEV, becenevMezo.value)));

    // ── Visszavonás gomb (telefonon nincs Ctrl+Z) ──
    // A böngésző saját visszavonását hívja (a jelzések ezt nem számolják betoldásnak). Ha ott nincs mit
    // visszavonni (pl. újratöltés után), de van megőrzött törölt szöveg, azt állítja vissza.
    document.getElementById('btn-vissza').addEventListener('click', () => {
      uzenetTorles('iras-msg');
      mezo.focus();
      const elotte = mezo.value;
      try { document.execCommand('undo'); } catch (_) { /* nem támogatott: lent a tartalék */ }
      if (mezo.value !== elotte) return;
      if (visszaallithato(orzott, mezo.value)) visszaallit();
      else uzenet('iras-msg', t('iras.nincs_visszavonas'), 'info');
    });

    // ── Íróüzem ──
    // A szövegpanel kitölti a képernyőt; a feladat behajtható, a betű nagyítható. Kilépés: gomb vagy Esc.
    const panel = document.getElementById('iras-panel');
    const btnIro = document.getElementById('btn-iro');
    const btnFeladat = document.getElementById('btn-feladat');
    const iroFeladat = document.getElementById('iro-feladat');
    const btnBetu = document.getElementById('btn-betu');
    function betuBeallit(nagy) {
      panel.classList.toggle('nagy-betu', nagy);
      btnBetu.setAttribute('aria-pressed', String(nagy));
    }
    betuBeallit(tarol((ls) => ls.getItem(BETUMERET)) === '1');
    btnBetu.addEventListener('click', () => {
      const nagy = !panel.classList.contains('nagy-betu');
      betuBeallit(nagy);
      tarol((ls) => (nagy ? ls.setItem(BETUMERET, '1') : ls.removeItem(BETUMERET)));
    });
    btnFeladat.addEventListener('click', () => {
      iroFeladat.hidden = !iroFeladat.hidden;
      btnFeladat.setAttribute('aria-expanded', String(!iroFeladat.hidden));
    });
    function irouzemBe() {
      panel.classList.add('iro-uzem');
      document.body.classList.add('iro-uzem-nyitva');
      btnIro.setAttribute('aria-pressed', 'true');
      btnIro.textContent = t('iras.iro_ki');
      mezo.focus();
    }
    const irouzemKi = () => {
      panel.classList.remove('iro-uzem');
      document.body.classList.remove('iro-uzem-nyitva');
      btnIro.setAttribute('aria-pressed', 'false');
      btnIro.textContent = t('iras.iro_be');
      iroFeladat.hidden = true;
      btnFeladat.setAttribute('aria-expanded', 'false');
    };
    btnIro.addEventListener('click', () => (panel.classList.contains('iro-uzem') ? irouzemKi() : irouzemBe()));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panel.classList.contains('iro-uzem')) irouzemKi(); });

    document.getElementById('btn-bead').addEventListener('click', async (e) => {
      uzenetTorles('iras-msg');
      const becenev = becenevMezo.value.trim();
      const szoveg = mezo.value.replace(/\r\n/g, '\n');
      if (becenev.length < 2) { uzenet('iras-msg', t('iras.becenev_kell')); becenevMezo.focus(); return; }
      if (!szoveg.trim()) { uzenet('iras-msg', t('iras.ures')); return; }
      if (szoveg.length > SZOVEG_MAX) { uzenet('iras-msg', t('iras.hosszu', { max: SZOVEG_MAX })); return; }
      if (!confirm(t('iras.megerosites'))) return;

      mezo.disabled = true;
      becenevMezo.disabled = true;
      const vissza = gombVar(e.currentTarget, t('iras.bead_folyamat'));
      try {
        const { data } = await linkBeadas({ token, becenev, szoveg, jelzesek: figyelo.dokumentum(szoveg) });
        // A beadott szöveg is a nyugtába kerül: a diák beadás után is meg tudja nyitni.
        const nyugta = { ...data, becenev, szoveg };
        tarol((ls) => {
          ls.setItem(NYUGTA, JSON.stringify(nyugta));
          ls.removeItem(PISZKOZAT);
          ls.removeItem(TOROLT);
        });
        irouzemKi();
        removeEventListener('beforeunload', bezarasElott);
        clearTimeout(mentesIdo);
        figyelo.torles();
        figyelo.leallit();
        nyugtaMutat(nyugta);
        window.scrollTo({ top: 0 });
      } catch (err) {
        uzenet('iras-msg', hibaSzoveg(err));
        mezo.disabled = false;
        becenevMezo.disabled = false;
        if (err?.details?.kod === 'becenev_foglalt') becenevMezo.focus();
        vissza();
      }
    });
  }
</script>
</body>
</html>
