<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WritingReview – Visszajelzés</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="WritingReview"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="theme-diak">

<div id="loading-screen">Betöltés...</div>

<div class="topbar gated" id="topbar">
  <div class="brand">Writing<span>Review</span></div>
  <div class="topbar-right">
    <div class="user-info">🎓 <strong id="user-name">–</strong></div>
    <button class="btn-logout" onclick="logout()">Kilépés</button>
  </div>
</div>

<main class="main centered gated" id="app-main">
  <a class="vissza-link" href="diak.html">← Feladataim</a>

  <div class="page-header">
    <h1 id="cim">Visszajelzés</h1>
    <p id="alcim">–</p>
  </div>

  <div id="tartalom"><div class="empty-state"><div class="spinner"></div></div></div>
</main>

<script type="module">
  import { vedettOldal, esc, datum } from './js/guard.js';
  import { statuszBadge, STATUSZ_DIAK } from './js/ui.js';
  import { db, doc, getDoc } from './js/firebase-config.js';

  await vedettOldal('diak');

  const beadasId = new URLSearchParams(location.search).get('id');
  const tartalom = document.getElementById('tartalom');

  if (!beadasId) {
    tartalom.innerHTML = `<div class="empty-state"><p>Hiányzó azonosító.
      <a href="diak.html">Vissza a listához</a></p></div>`;
    throw new Error('nincs id');
  }

  // ── BEADÁS ──
  let beadas;
  try {
    const snap = await getDoc(doc(db, 'beadasok', beadasId));
    if (!snap.exists()) throw new Error('nincs');
    beadas = snap.data();
  } catch (e) {
    tartalom.innerHTML = `<div class="empty-state"><p>Ez a beadás nem érhető el.
      <a href="diak.html">Vissza</a></p></div>`;
    throw e;
  }

  // Feladat címe
  let feladatCim = '–';
  let rubrika = {};
  try {
    const f = await getDoc(doc(db, 'feladatok', beadas.feladat_id));
    if (f.exists()) { feladatCim = f.data().cim; rubrika = f.data().rubrika || {}; }
  } catch (_) { /* törölt feladat */ }

  document.getElementById('cim').textContent = feladatCim;
  document.getElementById('alcim').textContent = `Beadva: ${datum(beadas.letrehozva)}`;

  // ── MÉG NINCS ELKÜLDVE ──
  // Ilyenkor a szabály sem engedné olvasni a visszajelzést.
  if (beadas.statusz !== 'elkuldve') {
    const mit = {
      feltoltve:   'A dolgozatod megérkezett, még nem kezdődött el a feldolgozás.',
      folyamatban: 'Az AI épp olvassa a dolgozatodat.',
      javitva:     'Az AI végzett, most a tanárod ellenőrzi. Amint elküldi, itt fogod látni.',
      hiba:        'A feldolgozás során hiba történt. Szólj a tanárodnak.'
    }[beadas.statusz] || 'A visszajelzés még nem érkezett meg.';

    tartalom.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⏳</div>
      <p>${statuszBadge(beadas.statusz, STATUSZ_DIAK)}</p>
      <p style="margin-top:1rem;">${esc(mit)}</p>
    </div>`;
    throw new Error('meg nincs elkuldve');
  }

  // ── TANÁRI VISSZAJELZÉS ──
  let tanari = null;
  try {
    const s = await getDoc(doc(db, 'beadasok', beadasId, 'ertekeles', 'tanari'));
    if (s.exists()) tanari = s.data();
  } catch (e) {
    console.error(e);
  }

  if (!tanari) {
    tartalom.innerHTML = `<div class="empty-state">
      <p>A visszajelzés nem tölthető be. Szólj a tanárodnak.</p></div>`;
    throw new Error('nincs tanari');
  }

  // ── KIFEJTŐS DOLGOZAT: kérdésenként, elemenként ──
  // A visszajelzés egyben javítókulcs: a diák látja, mit írt jól, és mi
  // lett volna a helyes – hacsak a tanár ki nem kapcsolta (újra felhasznált
  // dolgozatnál a megoldás kiszivároghatna). Ilyenkor az "allitas" nincs a
  // dokumentumban, és csak a saját szavai és a pontok látszanak.
  function kerdesenkent(t) {
    const JEL = {
      megvan: ['✓', 'Jó'], reszben: ['½', 'Részben jó'],
      hianyzik: ['✕', 'Hiányzik'], teves: ['✕', 'Téves']
    };
    const elemSor = (e) => {
      // Leírta, de a sorrend-szabály szerint nincs a helyén: ne ✓ + 0 pont legyen.
      const [jel, cimke] = e.rossz_helyen ? ['↕', 'Jó, de nem a helyén'] : (JEL[e.statusz] || JEL.hianyzik);
      const helyes = e.allitas
        ? (e.statusz === 'megvan' ? esc(e.allitas) : `<strong>Helyesen:</strong> ${esc(e.allitas)}`)
        : esc(cimke);
      return `<li class="vk-elem s-${e.rossz_helyen ? 'reszben' : esc(e.statusz)}">
          <span class="vk-jel" title="${esc(cimke)}">${jel}</span>
          <div>${helyes}${e.idezet ? `<div class="vk-idezet">Te: „${esc(e.idezet)}”${e.statusz === 'teves' ? ' – ez nem helyes' : ''}${e.rossz_helyen ? ' – jó, de nem a helyén' : ''}</div>` : ''}</div>
          <span class="vk-pont">${esc(e.pont)}</span>
        </li>`;
    };
    return `
      <div class="panel">
        <div class="panel-header"><h2>📊 Kérdésenként</h2>
          <span class="badge javitva">${esc(t.osszpontszam)} / ${esc(t.max_pontszam)} pont${t.szazalek != null ? ` · ${esc(t.szazalek)}%` : ''}</span></div>
        <div class="panel-body">
          ${t.kerdesek.map((k) => `
            <div class="vk-kerdes">
              <div class="vk-fej">
                <strong>${esc(k.sorszam)}.</strong>
                <span>${esc(k.szoveg || '')}</span>
                <span class="vk-kerdes-pont">${esc(k.pont)} / ${esc(k.max)}</span>
              </div>
              ${k.valasztott ? `<p class="halvany">A választásod: ${esc(k.valasztott)}</p>` : ''}
              ${k.sorrend ? '<p class="halvany">↕ Ennél a kérdésnél a sorrend is számított.</p>' : ''}
              <ul class="vk-elemek">
                ${(t.helyes_valaszok_lathatok === false
                    ? k.elemek.filter((e) => e.statusz !== 'hianyzik')
                    : k.elemek).map(elemSor).join('')}
                ${(k.kulcson_kivul || []).map((x) => `<li class="vk-elem ${x.elfogadva ? 's-megvan' : 's-hianyzik'}">
                    <span class="vk-jel">+</span>
                    <div><div class="vk-idezet">Te: „${esc(x.idezet)}”</div>${x.elfogadva ? 'Ezt is elfogadta a tanár.' : 'Ez nem számított bele.'}</div>
                    <span class="vk-pont"></span>
                  </li>`).join('')}
              </ul>
            </div>`).join('')}
          <p class="halvany">✓ jó · ½ részben jó · ✕ hiányzik vagy téves${t.kerdesek.some((k) => k.sorrend) ? ' · ↕ jó, de nem a helyén' : ''}</p>
        </div>
      </div>`;
  }

  tartalom.innerHTML = `
    ${tanari.jegy ? `
      <div class="jegy-kartya">
        <div class="jegy-label">Jegy</div>
        <div class="jegy-szam">${esc(tanari.jegy)}</div>
      </div>` : ''}

    <div class="panel">
      <div class="panel-header"><h2>💬 A tanárod visszajelzése</h2></div>
      <div class="panel-body">
        <div class="visszajelzes-szoveg">${esc(tanari.szoveg).replace(/\n/g, '<br/>')}</div>
        ${tanari.jovahagyva_at
          ? `<p class="halvany" style="margin-top:1.2rem;">Elküldve: ${datum(tanari.jovahagyva_at)}</p>`
          : ''}
      </div>
    </div>

    ${(tanari.kerdesek || []).length ? kerdesenkent(tanari) : (tanari.szempontok || []).length ? `
      <div class="panel">
        <div class="panel-header"><h2>📊 Pontozás</h2></div>
        <div class="panel-body">
          <div class="tabla-gorgeto">
            <table class="tabla eredmeny-tabla">
              <thead><tr><th>Szempont</th><th>Pont</th><th>Megjegyzés</th></tr></thead>
              <tbody>${tanari.szempontok.map((sz) => `
                <tr>
                  <td>${esc(sz.cim || sz.kulcs)}</td>
                  <td>${esc(sz.pont)} / ${esc(sz.max)}</td>
                  <td class="megj">${esc(sz.megjegyzes || '')}</td>
                </tr>`).join('')}</tbody>
              <tfoot><tr>
                <td>Összesen</td>
                <td>${esc(tanari.osszpontszam)} / ${esc(tanari.max_pontszam)}</td>
                <td>${tanari.szazalek != null ? `${esc(tanari.szazalek)}%` : ''}${tanari.jegy ? ` · jegy: ${esc(tanari.jegy)}` : ''}</td>
              </tr></tfoot>
            </table>
          </div>
        </div>
      </div>` : (rubrika.szempontok || []).length ? `
      <div class="panel">
        <div class="panel-header"><h2>📐 Mi alapján értékeltek</h2></div>
        <div class="panel-body">
          <table class="tabla">
            <thead><tr><th>Szempont</th><th>Pont</th></tr></thead>
            <tbody>${rubrika.szempontok.map((sz) =>
              `<tr><td>${esc(sz.cim || sz.kulcs)}</td><td>${esc(sz.suly)}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>` : ''}

    ${beadas.atirat ? `
      <div class="panel">
        <div class="panel-header"><h2>✍️ A dolgozatod, ahogy az AI kiolvasta</h2></div>
        <div class="panel-body">
          <pre class="atirat">${esc(beadas.atirat)}</pre>
          <p class="halvany">
            Ha ez nem egyezik azzal, amit írtál, a gép félreolvasta a kézírást –
            érdemes szólnod a tanárodnak.
          </p>
        </div>
      </div>` : ''}`;
</script>
</body>
</html>
