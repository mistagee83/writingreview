<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="vj.oldalcim">WritingReview – Visszajelzés</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="diak-oldal">

<!-- A DIÁK VISSZAJELZÉSE A SAJÁT DIÁKLINKJÉN (visszajelzes.html?d=<diák tokenje>).
     Belépés nincs: a beadáskor kapott token a jogosultság. Az adat a diakVisszajelzes
     függvényből jön, és csak a tanár által jóváhagyott visszajelzést tartalmazza. -->

<div class="topbar">
  <div class="brand">Writing<span>Review</span></div>
  <div class="topbar-right" data-nyelvvalaszto></div>
</div>

<main class="main narrow diak-main">
  <div id="tartalom">
    <div class="empty-state bare"><div class="spinner"></div></div>
  </div>
</main>

<script type="module">
  import { t, datumSzoveg } from './js/i18n.js';
  // Csak az escape-függvény kell innen; a védett oldal kapuja (vedettOldal) itt NEM fut.
  import { esc } from './js/guard.js';
  import { hibaSzoveg, jegyMegjelenit } from './js/ui.js';
  import { functions, httpsCallable } from './js/firebase-config.js';

  const diakVisszajelzes = httpsCallable(functions, 'diakVisszajelzes');
  const token = new URLSearchParams(location.search).get('d') || '';
  const tartalom = document.getElementById('tartalom');
  const ido = (iso) => (iso ? datumSzoveg(new Date(iso)) : '');

  function uzenetLap(ikon, szoveg, cim = '') {
    tartalom.innerHTML = `<div class="panel"><div class="panel-body"><div class="empty-state bare">
      <div class="empty-icon">${ikon}</div>
      ${cim ? `<p><strong>${esc(cim)}</strong></p>` : ''}
      <p>${esc(szoveg)}</p></div></div></div>`;
  }

  let adat;
  try {
    ({ data: adat } = await diakVisszajelzes({ token }));
  } catch (e) {
    uzenetLap('⚠️', e?.details?.kod === 'diaklink_ervenytelen' ? t('vj.ervenytelen') : hibaSzoveg(e));
    throw e;
  }

  if (adat.cim) document.title = `${adat.cim} – WritingReview`;

  if (adat.allapot === 'lejart') {
    uzenetLap('⏰', t('vj.lejart'));
  } else if (adat.allapot === 'varakozik') {
    uzenetLap('⏳', t('vj.varakozik', { datum: ido(adat.lejar) }), adat.cim);
  } else {
    rajzol(adat);
  }

  function rajzol(a) {
    const v = a.visszajelzes;
    const jegy = v.jegy != null ? esc(jegyMegjelenit(v.jegy, v.jegy_tipus)) : '';
    const tabla = v.szempontok.length ? `
      <div class="panel">
        <div class="panel-header"><h2>${t('vj.pontozas_cim')}</h2></div>
        <div class="panel-body">
          <div class="tabla-gorgeto">
            <table class="tabla eredmeny-tabla">
              <thead><tr><th>${t('beadas.szempont')}</th><th>${t('beadas.pont')}</th><th>${t('vj.megjegyzes')}</th></tr></thead>
              <tbody>${v.szempontok.map((sz) => `
                <tr>
                  <td>${esc(sz.cim)}</td>
                  <td>${esc(sz.pont ?? '–')} / ${esc(sz.max ?? '–')}</td>
                  <td class="megj">${esc(sz.megjegyzes)}</td>
                </tr>`).join('')}</tbody>
              <tfoot><tr>
                <td>${t('vj.osszesen')}</td>
                <td>${t('vj.pont_osszes', { ossz: esc(v.osszpontszam ?? '–'), max: esc(v.max_pontszam ?? '–') })}</td>
                <td>${v.szazalek != null ? `${esc(v.szazalek)}%` : ''}</td>
              </tr></tfoot>
            </table>
          </div>
        </div>
      </div>` : '';

    tartalom.innerHTML = `
      <div class="page-header">
        <h1>${esc(a.cim || t('vj.cim'))}</h1>
        <p>${t('vj.alcim', { becenev: esc(a.becenev), datum: esc(ido(a.beadva)) })}</p>
      </div>

      ${jegy ? `
        <div class="jegy-kartya">
          <div class="jegy-label">${t('vj.jegy')}</div>
          <div class="jegy-szam">${jegy}</div>
        </div>` : ''}

      <div class="panel">
        <div class="panel-header"><h2>${t('vj.tanari_cim')}</h2></div>
        <div class="panel-body">
          <div class="visszajelzes-szoveg">${esc(v.szoveg).replace(/\n/g, '<br/>')}</div>
          ${v.jovahagyva ? `<p class="halvany" style="margin-top:1.2rem;">${t('vj.elkuldve', { datum: esc(ido(v.jovahagyva)) })}</p>` : ''}
        </div>
      </div>

      ${tabla}

      <div class="panel">
        <div class="panel-header"><h2>${t('vj.szoveged_cim')}</h2></div>
        <div class="panel-body"><pre class="atirat">${esc(a.szoveg)}</pre></div>
      </div>

      <p class="halvany">${t('vj.eddig_el', { datum: esc(ido(a.lejar)) })}</p>`;
  }
</script>
</body>
</html>
