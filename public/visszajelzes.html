<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="vj.oldalcim">WritingReview – Visszajelzés</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="WritingReview"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="theme-diak">

<div id="loading-screen" data-i18n="kozos.betoltes">Betöltés...</div>

<div class="topbar gated" id="topbar">
  <div class="brand">Writing<span>Review</span></div>
  <div class="topbar-right">
    <div class="user-info">🎓 <strong id="user-name">–</strong></div>
    <button class="btn-logout" onclick="logout()" data-i18n="kozos.kilepes">Kilépés</button>
  </div>
</div>

<main class="main centered gated" id="app-main">
  <a class="vissza-link" href="diak.html" data-i18n="beadas.vissza">← Feladataim</a>

  <div class="page-header">
    <h1 id="cim" data-i18n="vj.cim">Visszajelzés</h1>
    <p id="alcim">–</p>
  </div>

  <div id="tartalom"><div class="empty-state"><div class="spinner"></div></div></div>
</main>

<script type="module">
  import { t } from './js/i18n.js';
  import { vedettOldal, esc, datum } from './js/guard.js';
  import { statuszBadge, STATUSZ_DIAK, jegyMegjelenit } from './js/ui.js';
  import { db, doc, getDoc } from './js/firebase-config.js';

  await vedettOldal('diak');

  const beadasId = new URLSearchParams(location.search).get('id');
  const tartalom = document.getElementById('tartalom');

  if (!beadasId) {
    tartalom.innerHTML = `<div class="empty-state"><p>${t('vj.hianyzo_azonosito')}</p></div>`;
    throw new Error('nincs id');
  }

  // ── BEADÁS ──
  let beadas;
  try {
    const snap = await getDoc(doc(db, 'beadasok', beadasId));
    if (!snap.exists()) throw new Error('nincs');
    beadas = snap.data();
  } catch (e) {
    tartalom.innerHTML = `<div class="empty-state"><p>${t('vj.nem_elerheto')}</p></div>`;
    throw e;
  }

  // Feladat címe
  let feladatCim = '–';
  let rubrika = {};
  try {
    const f = await getDoc(doc(db, 'feladatok', beadas.feladat_id));
    if (f.exists()) { feladatCim = f.data().cim; rubrika = f.data().rubrika || {}; }
  } catch (_) { /* törölt feladat */ }

  document.getElementById('cim').textContent = feladatCim;
  document.getElementById('alcim').textContent = t('diak.beadva_datum', { datum: datum(beadas.letrehozva) });

  // ── MÉG NINCS ELKÜLDVE ──
  // Ilyenkor a szabály sem engedné olvasni a visszajelzést.
  if (beadas.statusz !== 'elkuldve') {
    const mit = {
      feltoltve:   t('vj.statusz_feltoltve'),
      folyamatban: t('vj.statusz_folyamatban'),
      javitva:     t('vj.statusz_javitva'),
      hiba:        t('vj.statusz_hiba')
    }[beadas.statusz] || t('vj.statusz_alap');

    tartalom.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⏳</div>
      <p>${statuszBadge(beadas.statusz, STATUSZ_DIAK)}</p>
      <p style="margin-top:1rem;">${esc(mit)}</p>
    </div>`;
    throw new Error('meg nincs elkuldve');
  }

  // ── TANÁRI VISSZAJELZÉS ──
  let tanari = null;
  try {
    const s = await getDoc(doc(db, 'beadasok', beadasId, 'ertekeles', 'tanari'));
    if (s.exists()) tanari = s.data();
  } catch (e) {
    console.error(e);
  }

  if (!tanari) {
    tartalom.innerHTML = `<div class="empty-state">
      <p>${t('vj.nem_toltheto')}</p></div>`;
    throw new Error('nincs tanari');
  }

  tartalom.innerHTML = `
    ${tanari.jegy != null ? `
      <div class="jegy-kartya">
        <div class="jegy-label">${t('vj.jegy')}</div>
        <div class="jegy-szam">${esc(jegyMegjelenit(tanari.jegy, tanari.jegy_tipus))}</div>
      </div>` : ''}

    <div class="panel">
      <div class="panel-header"><h2>${t('vj.tanari_cim')}</h2></div>
      <div class="panel-body">
        <div class="visszajelzes-szoveg">${esc(tanari.szoveg).replace(/\n/g, '<br/>')}</div>
        ${tanari.jovahagyva_at
          ? `<p class="halvany" style="margin-top:1.2rem;">${t('vj.elkuldve', { datum: datum(tanari.jovahagyva_at) })}</p>`
          : ''}
      </div>
    </div>

    ${(tanari.szempontok || []).length ? `
      <div class="panel">
        <div class="panel-header"><h2>${t('vj.pontozas_cim')}</h2></div>
        <div class="panel-body">
          <div class="tabla-gorgeto">
            <table class="tabla eredmeny-tabla">
              <thead><tr><th>${t('beadas.szempont')}</th><th>${t('beadas.pont')}</th><th>${t('vj.megjegyzes')}</th></tr></thead>
              <tbody>${tanari.szempontok.map((sz) => `
                <tr>
                  <td>${esc(sz.cim || sz.kulcs)}</td>
                  <td>${esc(sz.pont)} / ${esc(sz.max)}</td>
                  <td class="megj">${esc(sz.megjegyzes || '')}</td>
                </tr>`).join('')}</tbody>
              <tfoot><tr>
                <td>${t('vj.osszesen')}</td>
                <td>${esc(tanari.osszpontszam)} / ${esc(tanari.max_pontszam)}</td>
                <td>${tanari.szazalek != null ? `${esc(tanari.szazalek)}%` : ''}${tanari.jegy != null ? t('vj.jegy_kis', { jegy: esc(jegyMegjelenit(tanari.jegy, tanari.jegy_tipus)) }) : ''}</td>
              </tr></tfoot>
            </table>
          </div>
        </div>
      </div>` : (rubrika.szempontok || []).length ? `
      <div class="panel">
        <div class="panel-header"><h2>${t('vj.rubrika_cim')}</h2></div>
        <div class="panel-body">
          <table class="tabla">
            <thead><tr><th>${t('beadas.szempont')}</th><th>${t('beadas.pont')}</th></tr></thead>
            <tbody>${rubrika.szempontok.map((sz) =>
              `<tr><td>${esc(sz.cim || sz.kulcs)}</td><td>${esc(sz.suly)}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>` : ''}`;
</script>
</body>
</html>
