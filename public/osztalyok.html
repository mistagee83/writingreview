<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="osztalyok.oldalcim">WritingReview – Osztályok</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="WritingReview"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<div id="loading-screen" data-i18n="kozos.betoltes">Betöltés...</div>

<div class="topbar gated" id="topbar">
  <div class="brand">Writing<span>Review</span></div>
  <div class="topbar-right">
    <div class="user-info"><span class="csak-nagy" data-i18n="kozos.tanar_fejlec">👨‍🏫 Tanár &nbsp;|&nbsp;</span><strong id="user-name">–</strong></div>
    <button class="btn-logout" onclick="logout()" data-i18n="kozos.kilepes">Kilépés</button>
  </div>
</div>

<div class="layout gated" id="app-layout">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main narrow">
    <div class="page-header split">
      <div>
        <h1 data-i18n="osztalyok.cim">Osztályok</h1>
        <p data-i18n="osztalyok.alcim">A diákok egyszer csatlakoznak az osztálykóddal – onnantól a feladatok maguktól megjelennek náluk</p>
      </div>
    </div>

    <!-- ÚJ OSZTÁLY -->
    <div class="panel">
      <div class="panel-header"><h2 data-i18n="osztalyok.uj_cim">➕ Új osztály</h2></div>
      <div class="panel-body">
        <div class="code-input-row">
          <input type="text" id="osztaly-nev" placeholder="Pl. 9.B angol" data-i18n-placeholder="osztalyok.nev_pelda" maxlength="100" />
          <button class="btn-primary" id="btn-letrehoz" data-i18n="osztalyok.letrehozas">Létrehozás</button>
        </div>
        <div class="msg" id="uj-msg"></div>
      </div>
    </div>

    <!-- OSZTÁLYOK LISTÁJA -->
    <div class="panel">
      <div class="panel-header"><h2 data-i18n="osztalyok.lista_cim">🎓 Osztályaim</h2></div>
      <div class="panel-body flush">
        <div id="lista">
          <div class="empty-state bare"><p data-i18n="kozos.betoltes">Betöltés...</p></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { t } from './js/i18n.js';
  import { vedettOldal, esc, datum } from './js/guard.js';
  import { oldalsav } from './js/nav.js';
  import { uzenet, uzenetTorles, hibaSzoveg, gombVar, vagolapra } from './js/ui.js';
  import {
    db, functions, httpsCallable,
    collection, doc, getDocs, updateDoc, deleteDoc,
    query, where, orderBy, onSnapshot
  } from './js/firebase-config.js';

  // Az oldalsáv a hitelesítés UTÁN rendereljük: onnan tudjuk, admin-e a
  // felhasználó, és csak akkor tesszük ki az admin menüpontot. (A sidebar
  // a kapuzott UI-ban van, tehát addig nem is látszik.)
  const { user, admin } = await vedettOldal('tanar');
  oldalsav('osztalyok.html', { admin });

  const osztalyLetrehozas = httpsCallable(functions, 'osztalyLetrehozas');
  const diakEltavolitas = httpsCallable(functions, 'diakEltavolitas');

  // ── ÚJ OSZTÁLY ──
  const btn = document.getElementById('btn-letrehoz');
  const nevInput = document.getElementById('osztaly-nev');

  async function letrehoz() {
    const nev = nevInput.value.trim();
    uzenetTorles('uj-msg');
    if (!nev) { uzenet('uj-msg', t('osztalyok.adj_nevet')); return; }

    const vissza = gombVar(btn, t('osztalyok.letrehozas_folyamat'));
    try {
      const { data } = await osztalyLetrehozas({ nev });
      nevInput.value = '';
      uzenet('uj-msg', t('osztalyok.letrehozva', { kod: data.kod }), 'success');
    } catch (e) {
      uzenet('uj-msg', hibaSzoveg(e));
    } finally {
      vissza();
    }
  }

  btn.addEventListener('click', letrehoz);
  nevInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') letrehoz(); });

  // ── LISTA (realtime) ──
  const lista = document.getElementById('lista');

  onSnapshot(
    query(
      collection(db, 'osztalyok'),
      where('tanar_id', '==', user.uid),
      orderBy('letrehozva', 'desc')
    ),
    (snap) => {
      if (snap.empty) {
        lista.innerHTML = `<div class="empty-state bare">
          <div class="empty-icon">🎓</div>
          <p>${t('osztalyok.nincs_osztaly')}</p>
        </div>`;
        return;
      }

      lista.innerHTML = snap.docs.map((d) => {
        const o = d.data();
        return `
          <div class="list-card">
            <div>
              <h3>${esc(o.nev)}</h3>
              <div class="list-card-meta">
                <span class="feladat-kod">${esc(o.kod)}</span>
                <span>${t('osztalyok.diak_szam', { db: o.diak_szam || 0 })}</span>
                <span>${datum(o.letrehozva)}</span>
                <span class="badge ${o.aktiv ? 'aktiv' : 'inaktiv'}">
                  ${o.aktiv ? t('osztalyok.aktiv') : t('osztalyok.zart')}
                </span>
              </div>
            </div>
            <div class="list-card-actions">
              <button class="btn-sm" data-akcio="masol" data-kod="${esc(o.kod)}">${t('osztalyok.kod_gomb')}</button>
              <button class="btn-sm" data-akcio="nevsor" data-id="${esc(d.id)}">${t('osztalyok.nevsor_gomb')}</button>
              <button class="btn-sm" data-akcio="toggle" data-id="${esc(d.id)}" data-aktiv="${o.aktiv ? '1' : '0'}">
                ${o.aktiv ? t('osztalyok.zaras_gomb') : t('osztalyok.nyitas_gomb')}
              </button>
              <button class="btn-sm danger" data-akcio="torol" data-id="${esc(d.id)}" data-nev="${esc(o.nev)}">🗑</button>
            </div>
          </div>
          <div class="nevsor" id="nevsor-${esc(d.id)}"></div>`;
      }).join('');

      // Az innerHTML csere kiürítette a névsor konténereket – ha volt
      // nyitva egy, tegyük vissza.
      if (nyitottNevsor) nevsorRender(nyitottNevsor);
    },
    (e) => {
      console.error(e);
      lista.innerHTML = `<div class="empty-state bare"><p>${t('osztalyok.betoltesi_hiba')}</p></div>`;
    }
  );

  // ── AKCIÓK ──
  lista.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-akcio]');
    if (!b) return;
    const { akcio, id } = b.dataset;

    if (akcio === 'masol') {
      vagolapra(b.dataset.kod, b);
      return;
    }

    if (akcio === 'nevsor') {
      await nevsorMutat(id, b);
      return;
    }

    if (akcio === 'diak-torol') {
      const { osztaly, diak, nev } = b.dataset;
      const ok = confirm(t('osztalyok.diak_torles_kerdes', { nev }));
      if (!ok) return;

      const vissza = gombVar(b, '');
      try {
        await diakEltavolitas({ osztalyId: osztaly, diakUid: diak });
        // A létszám változása kiváltja az onSnapshot-ot, az pedig
        // újrarendereli a nyitott névsort – nem kell kézzel törölni a sort.
      } catch (err) {
        alert(t('osztalyok.nem_sikerult', { ok: hibaSzoveg(err) }));
        vissza();
      }
      return;
    }

    b.disabled = true;
    try {
      if (akcio === 'toggle') {
        await updateDoc(doc(db, 'osztalyok', id), { aktiv: b.dataset.aktiv !== '1' });
      } else if (akcio === 'torol') {
        const ok = confirm(t('osztalyok.torles_kerdes', { nev: b.dataset.nev }));
        if (!ok) { b.disabled = false; return; }
        await deleteDoc(doc(db, 'osztalyok', id));
      }
      // a lista onSnapshot-tal frissül magától
    } catch (err) {
      b.disabled = false;
      alert(t('osztalyok.hiba', { ok: err.message }));
    }
  });

  // ══════════════════════════════════════════
  // NÉVSOR
  //
  // A megnyitott névsort megjegyezzük, mert a lista onSnapshot-tal
  // frissül (pl. létszámváltozáskor), és az innerHTML csere becsukná.
  // ══════════════════════════════════════════
  let nyitottNevsor = null;

  function nevsorSor(osztalyId, d) {
    const tag = d.data();
    return `<tr>
      <td>${esc(tag.nev)}</td>
      <td>${esc(tag.email)}</td>
      <td>${datum(tag.csatlakozott)}</td>
      <td class="tabla-akcio">
        <button class="btn-sm danger" data-akcio="diak-torol"
                data-osztaly="${esc(osztalyId)}"
                data-diak="${esc(d.id)}"
                data-nev="${esc(tag.nev)}"
                title="${t('osztalyok.eltavolitas_cim')}">✕</button>
      </td>
    </tr>`;
  }

  /** A névsort kirendereli az adott osztály konténerébe. */
  async function nevsorRender(osztalyId) {
    const el = document.getElementById(`nevsor-${osztalyId}`);
    if (!el) return;

    try {
      const snap = await getDocs(collection(db, 'osztalyok', osztalyId, 'tagok'));

      el.innerHTML = snap.empty
        ? `<div class="nevsor-box"><p class="halvany">${t('osztalyok.nincs_tag')}</p></div>`
        : `<div class="nevsor-box">
            <table class="tabla">
              <thead><tr><th>${t('osztalyok.oszlop_nev')}</th><th>${t('osztalyok.oszlop_email')}</th><th>${t('osztalyok.oszlop_csatlakozott')}</th><th></th></tr></thead>
              <tbody>${snap.docs.map((d) => nevsorSor(osztalyId, d)).join('')}</tbody>
            </table>
          </div>`;
    } catch (e) {
      console.error(e);
      el.innerHTML = `<div class="nevsor-box"><p class="halvany">${t('osztalyok.nevsor_hiba')}</p></div>`;
    }

    // A nyitott állapotot a gomb feliratán is jelezzük
    const gomb = document.querySelector(
      `button[data-akcio="nevsor"][data-id="${osztalyId}"]`
    );
    if (gomb) gomb.textContent = t('osztalyok.nevsor_zar_gomb');
  }

  /** Nyit/zár. */
  async function nevsorMutat(osztalyId, gomb) {
    if (nyitottNevsor === osztalyId) {
      nyitottNevsor = null;
      const el = document.getElementById(`nevsor-${osztalyId}`);
      if (el) el.innerHTML = '';
      gomb.textContent = t('osztalyok.nevsor_gomb');
      return;
    }

    // Egyszerre egy névsor legyen nyitva
    if (nyitottNevsor) {
      const regi = document.getElementById(`nevsor-${nyitottNevsor}`);
      if (regi) regi.innerHTML = '';
      const regiGomb = document.querySelector(
        `button[data-akcio="nevsor"][data-id="${nyitottNevsor}"]`
      );
      if (regiGomb) regiGomb.textContent = t('osztalyok.nevsor_gomb');
    }

    nyitottNevsor = osztalyId;
    const vissza = gombVar(gomb, '');
    try {
      await nevsorRender(osztalyId);
    } finally {
      vissza();
      gomb.textContent = t('osztalyok.nevsor_zar_gomb');
    }
  }
</script>
</body>
</html>
