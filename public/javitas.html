<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="jav.oldalcim">WritingReview – Javítási sor</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="WritingReview"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<div id="loading-screen" data-i18n="kozos.betoltes">Betöltés...</div>

<div class="topbar gated" id="topbar">
  <div class="brand">Writing<span>Review</span></div>
  <div class="topbar-right">
    <div class="user-info"><span class="csak-nagy" data-i18n="kozos.tanar_fejlec">👨‍🏫 Tanár &nbsp;|&nbsp;</span><strong id="user-name">–</strong></div>
    <button class="btn-logout" onclick="logout()" data-i18n="kozos.kilepes">Kilépés</button>
  </div>
</div>

<div class="layout gated" id="app-layout">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main narrow">
    <div class="page-header">
      <h1 data-i18n="jav.cim">Javítási sor</h1>
      <p data-i18n="jav.alcim">Az AI javaslatait ellenőrizd, szerkeszd, majd küldd el a diáknak – addig ő semmit nem lát</p>
    </div>

    <div class="szuro" id="szuro">
      <button class="szuro-btn active" data-statusz="javitva" data-i18n="jav.szuro_javitva">📝 Ellenőrzésre vár</button>
      <button class="szuro-btn" data-statusz="folyamatban" data-i18n="jav.szuro_folyamatban">⚙️ Feldolgozás alatt</button>
      <button class="szuro-btn" data-statusz="elkuldve" data-i18n="jav.szuro_elkuldve">📧 Elküldve</button>
      <button class="szuro-btn" data-statusz="hiba" data-i18n="jav.szuro_hiba">⚠️ Hibás</button>
      <button class="szuro-btn" data-statusz="mind" data-i18n="jav.szuro_mind">Mind</button>
    </div>

    <div id="lista"><div class="empty-state bare"><p data-i18n="kozos.betoltes">Betöltés...</p></div></div>
  </main>
</div>

<!-- RÉSZLETEK MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-fejlec">
      <h2 id="m-cim">–</h2>
      <button class="btn-sm" id="m-bezar">✕</button>
    </div>
    <div class="modal-torzs" id="m-torzs"></div>
  </div>
</div>

<script type="module">
  import { t } from './js/i18n.js';
  import { vedettOldal, esc, datum } from './js/guard.js';
  import { oldalsav } from './js/nav.js';
  import { statuszBadge, uzenet, uzenetTorles, hibaSzoveg, gombVar, jegyMegjelenit } from './js/ui.js';
  import { kifejtosJavitas } from './js/kifejtos-javitas.js';
  import { skalaFeloldas, jegyJavaslat } from './js/kifejtos.js';
  import {
    db, storage, functions, httpsCallable,
    collection, doc, getDoc, getDocs,
    query, where, orderBy, onSnapshot,
    storageRef, getDownloadURL
  } from './js/firebase-config.js';

  // Az oldalsáv a hitelesítés UTÁN rendereljük: onnan tudjuk, admin-e a
  // felhasználó, és csak akkor tesszük ki az admin menüpontot. (A sidebar
  // a kapuzott UI-ban van, tehát addig nem is látszik.)
  const { user, admin } = await vedettOldal('tanar');
  oldalsav('javitas.html', { admin });

  const visszajelzesJovahagyas = httpsCallable(functions, 'visszajelzesJovahagyas');
  const beadasUjrafuttatas = httpsCallable(functions, 'beadasUjrafuttatas');

  const lista = document.getElementById('lista');
  let leiratkozas = null;

  /** Az átírás olvashatósága: az AI kódja (jo / kozepes / gyenge) → szöveg. */
  function olvashatosagSzoveg(kod) {
    const szoveg = {
      jo:       t('jav.olvashatosag_jo'),
      kozepes:  t('jav.olvashatosag_kozepes'),
      gyenge:   t('jav.olvashatosag_gyenge')
    }[kod];
    return esc(szoveg || kod);
  }
  let feladatCache = {};

  async function feladatCim(feladatId) {
    if (feladatCache[feladatId] !== undefined) return feladatCache[feladatId];
    try {
      const snap = await getDoc(doc(db, 'feladatok', feladatId));
      feladatCache[feladatId] = snap.exists() ? snap.data() : null;
    } catch (_) {
      feladatCache[feladatId] = null;
    }
    return feladatCache[feladatId];
  }

  // Az elküldött beadások pontszáma és jegye az ertekeles/ai és
  // ertekeles/tanari alkollekcióban van, nem a beadás dokumentumában.
  // A kulcsban a frissítés ideje is benne van: újraküldéskor (más jegy)
  // a beadás frissitve mezője változik, így nem marad régi érték.
  const eredmenyCache = {};

  async function eredmeny(beadasId, b) {
    const kulcs = `${beadasId}:${b.frissitve?.toMillis?.() ?? ''}`;
    if (!eredmenyCache[kulcs]) {
      eredmenyCache[kulcs] = Promise.all([
        getDoc(doc(db, 'beadasok', beadasId, 'ertekeles', 'ai')),
        getDoc(doc(db, 'beadasok', beadasId, 'ertekeles', 'tanari'))
      ]).then(([ai, tanari]) => ({
        ai: ai.exists() ? ai.data() : null,
        tanari: tanari.exists() ? tanari.data() : null
      })).catch(() => null);
    }
    return eredmenyCache[kulcs];
  }

  function eredmenyBadge(e) {
    if (!e) return '';
    const { ai, tanari } = e;
    // A diáknak elküldött (esetleg tanár által módosított) pontszám az
    // irányadó; régebbi, pontozás nélküli jóváhagyásnál az AI-é
    const p = tanari?.max_pontszam ? tanari : ai;
    const reszek = [];
    if (p?.max_pontszam) {
      reszek.push(`<span class="badge javitva">${t('jav.pont_badge', { ossz: esc(p.osszpontszam), max: esc(p.max_pontszam) })}` +
        `${p.szazalek != null ? ` · ${esc(p.szazalek)}%` : ''}</span>`);
    }
    if (tanari?.jegy != null) reszek.push(`<span class="badge aktiv">${t('jav.jegy_badge', { jegy: esc(jegyMegjelenit(tanari.jegy, tanari.jegy_tipus)) })}</span>`);
    return reszek.join('');
  }

  // ══════════════════════════════════════════
  // LISTA
  // ══════════════════════════════════════════
  function figyel(statusz) {
    if (leiratkozas) leiratkozas();

    const alap = [collection(db, 'beadasok'), where('tanar_id', '==', user.uid)];
    const q = statusz === 'mind'
      ? query(...alap, orderBy('letrehozva', 'desc'))
      : query(...alap, where('statusz', '==', statusz), orderBy('letrehozva', 'desc'));

    lista.innerHTML = `<div class="empty-state bare"><p>${t('kozos.betoltes')}</p></div>`;

    leiratkozas = onSnapshot(q, async (snap) => {
      if (snap.empty) {
        lista.innerHTML = `<div class="empty-state">
          <div class="empty-icon">📭</div><p>${t('jav.nincs_beadas')}</p></div>`;
        return;
      }

      const kartyak = await Promise.all(snap.docs.map(async (d) => {
        const b = d.data();
        const [f, e] = await Promise.all([
          feladatCim(b.feladat_id),
          b.statusz === 'elkuldve' ? eredmeny(d.id, b) : null
        ]);
        return `
          <div class="list-card">
            <div>
              <h3>${esc(b.diak_nev || t('jav.nevtelen_diak'))}</h3>
              <div class="list-card-meta">
                <span>${esc(f?.cim || t('jav.torolt_feladat'))}</span>
                <span>${datum(b.letrehozva)}</span>
                ${statuszBadge(b.statusz)}
                ${eredmenyBadge(e)}
                ${b.atirat_olvashatosag === 'gyenge'
                  ? `<span class="badge inaktiv">${t('jav.nehezen_olvashato')}</span>` : ''}
              </div>
              ${b.hiba ? `<p class="hiba-szoveg">${esc(b.hiba)}</p>` : ''}
            </div>
            <div class="list-card-actions">
              <button class="btn-sm" data-akcio="nyit" data-id="${esc(d.id)}">${t('jav.megnyitas')}</button>
              ${['hiba', 'javitva'].includes(b.statusz)
                ? `<button class="btn-sm" data-akcio="ujra" data-id="${esc(d.id)}">${t('jav.ujra')}</button>` : ''}
            </div>
          </div>`;
      }));

      lista.innerHTML = kartyak.join('');
    }, (e) => {
      console.error(e);
      lista.innerHTML = `<div class="empty-state bare"><p>${t('jav.betoltesi_hiba')}</p></div>`;
    });
  }

  document.getElementById('szuro').addEventListener('click', (e) => {
    const b = e.target.closest('.szuro-btn');
    if (!b) return;
    document.querySelectorAll('.szuro-btn').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    figyel(b.dataset.statusz);
  });

  figyel('javitva');

  // ══════════════════════════════════════════
  // AKCIÓK
  // ══════════════════════════════════════════
  lista.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-akcio]');
    if (!b) return;

    if (b.dataset.akcio === 'nyit') {
      megnyit(b.dataset.id);
      return;
    }

    if (b.dataset.akcio === 'ujra') {
      const vissza = gombVar(b, t('jav.fut'));
      try {
        await beadasUjrafuttatas({ beadasId: b.dataset.id });
      } catch (err) {
        alert(t('jav.nem_sikerult', { ok: hibaSzoveg(err) }));
      } finally {
        vissza();
      }
    }
  });

  // ══════════════════════════════════════════
  // RÉSZLETEK
  // ══════════════════════════════════════════
  const modal = document.getElementById('modal');
  const torzs = document.getElementById('m-torzs');

  document.getElementById('m-bezar').addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

  async function megnyit(beadasId) {
    modal.classList.add('show');
    torzs.innerHTML = `<div class="empty-state bare"><div class="spinner"></div></div>`;

    try {
      const bSnap = await getDoc(doc(db, 'beadasok', beadasId));
      if (!bSnap.exists()) { torzs.innerHTML = `<p>${t('jav.nem_talalhato')}</p>`; return; }
      const b = bSnap.data();
      const f = await feladatCim(b.feladat_id);

      document.getElementById('m-cim').textContent =
        `${b.diak_nev || t('jav.nevtelen')} – ${f?.cim || t('jav.torolt_feladat')}`;

      const aiSnap = await getDoc(doc(db, 'beadasok', beadasId, 'ertekeles', 'ai'));
      const ai = aiSnap.exists() ? aiSnap.data() : null;

      const tanariSnap = await getDoc(doc(db, 'beadasok', beadasId, 'ertekeles', 'tanari'));
      const tanari = tanariSnap.exists() ? tanariSnap.data() : null;

      // A jegy a FELADAT skáláján áll (magyar 1–5, A–F, százalék, egyéni).
      const skala = skalaFeloldas(f?.rubrika);
      const jegyMezo = skala.tipus === 'szazalek'
        ? `<input type="number" id="m-jegy" min="0" max="100" step="1" placeholder="%" style="max-width:140px;" />`
        : `<select id="m-jegy">
             <option value="">${t('jav.nincs_jegy')}</option>
             ${[...skala.fokozatok].reverse()
               .map((x) => `<option value="${esc(x.cimke)}">${esc(x.cimke)}</option>`).join('')}
           </select>`;
      // A kliens a skála saját értékét küldi (a szerver ezt is újra ellenőrzi)
      const jegyErtek = (str) => {
        if (str === '') return null;
        if (skala.tipus === 'szazalek') return Number(str);
        return skala.fokozatok.find((x) => String(x.cimke) === str)?.cimke ?? null;
      };

      // Kifejtős dolgozat: kérdésenkénti javítás a megoldókulcs szerint.
      // A kulcs csak a tanárnak olvasható alkollekcióban van.
      const kifejtosMod = ai?.mod === 'kifejtos';
      const aiJegy = ai ? jegyJavaslat(ai.osszpontszam, ai.max_pontszam, skala) : null;
      let kulcsAdat = null;
      if (kifejtosMod) {
        const ks = await getDoc(doc(db, 'feladatok', b.feladat_id, 'kulcs', 'aktualis')).catch(() => null);
        kulcsAdat = ks?.exists() ? ks.data() : null;
      }

      // A diáknak kimenő pontozás: a már elküldött változat, különben az
      // AI javaslata. A címek a feladat rubrikájából jönnek.
      const cimek = Object.fromEntries((f?.rubrika?.szempontok || []).map((sz) => [sz.kulcs, sz.cim]));
      // Kifejtősnél nincs szempontonkénti pontmező: ott elemenként dönt a tanár.
      const pontSorok = kifejtosMod ? [] : (tanari?.szempontok?.length ? tanari.szempontok : (ai?.szempontok || []))
        .map((sz) => ({ ...sz, cim: sz.cim || cimek[sz.kulcs] || sz.kulcs }));

      // Dolgozatfotók
      const kepUrlek = await Promise.all(
        (b.kep_paths || []).map((p) =>
          getDownloadURL(storageRef(storage, p)).catch(() => null))
      );

      torzs.innerHTML = `
        <div class="m-szekcio">
          <h4>${t('jav.fotok_cim')}</h4>
          <div class="kep-sor">
            ${kepUrlek.filter(Boolean).map((u, i) =>
              `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${t('beadas.oldal_alt', { n: i + 1 })}" /></a>`
            ).join('') || `<p class="halvany">${t('jav.kep_hiba')}</p>`}
          </div>
        </div>

        <div class="m-szekcio">
          <h4>${t('jav.atirat_cim')}
            ${b.atirat_olvashatosag ? `<span class="badge inaktiv">${olvashatosagSzoveg(b.atirat_olvashatosag)}</span>` : ''}
          </h4>
          <p class="halvany">${t('jav.atirat_figyelmeztetes')}</p>
          <pre class="atirat">${esc(b.atirat || t('jav.nincs_atirat'))}</pre>
          ${b.atirat_megjegyzes ? `<p class="halvany">${esc(b.atirat_megjegyzes)}</p>` : ''}
        </div>

        ${kifejtosMod ? `
        <div class="m-szekcio">
          <h4>${t('jav.kerdesenkent_cim')} <span class="badge javitva" id="kf-ossz"></span></h4>
          <p class="halvany">${t('jav.kerdesenkent_leiras')}</p>
          <div id="kf-javitas">${kulcsAdat ? '' : `<p class="hiba-szoveg">${t('jav.nincs_kulcs')}</p>`}</div>
          ${(ai.hibak || []).length ? `
          <h4 style="margin-top:1.2rem;">${t('jav.tartalmi_hibak', { db: ai.hibak.length })}</h4>
          <div class="hiba-lista">
            ${ai.hibak.map((h) => `
              <div class="hiba-elem">
                <span class="badge inaktiv">${esc(h.kategoria)}${h.kerdes ? t('jav.kerdes_jelzo', { n: esc(h.kerdes) }) : ''}</span>
                <div>${esc(h.idezet)}${h.javaslat ? ` → <strong>${esc(h.javaslat)}</strong>` : ''}</div>
                <p class="halvany">${esc(h.magyarazat)}</p>
              </div>`).join('')}
          </div>` : ''}
        </div>` : ai ? `
        <div class="m-szekcio">
          <h4>${t('jav.ai_ertekeles_cim')}
            <span class="badge javitva">${t('vj.pont_osszes', { ossz: ai.osszpontszam, max: ai.max_pontszam })}${ai.szazalek != null ? ` · ${ai.szazalek}%` : ''}${aiJegy != null ? ` · ${esc(jegyMegjelenit(aiJegy, skala.tipus))}` : ''}</span>
          </h4>
          <table class="tabla">
            <thead><tr><th>${t('beadas.szempont')}</th><th>${t('beadas.pont')}</th><th>${t('vj.megjegyzes')}</th></tr></thead>
            <tbody>${(ai.szempontok || []).map((sz) => `
              <tr>
                <td>${esc(sz.kulcs)}</td>
                <td><strong>${esc(sz.pont)}</strong> / ${esc(sz.max)}</td>
                <td>${esc(sz.megjegyzes)}</td>
              </tr>`).join('')}</tbody>
          </table>

          ${(ai.hibak || []).length ? `
          <h4 style="margin-top:1.2rem;">${t('jav.talalt_hibak', { db: ai.hibak.length })}</h4>
          <div class="hiba-lista">
            ${ai.hibak.map((h) => `
              <div class="hiba-elem">
                <span class="badge inaktiv">${esc(h.kategoria)}${h.tipus && h.tipus !== h.kategoria ? ` · ${esc(h.tipus)}` : ''}${h.kerdes ? t('jav.kerdes_jelzo', { n: esc(h.kerdes) }) : ''}</span>
                <div><s>${esc(h.idezet)}</s> → <strong>${esc(h.javaslat)}</strong></div>
                <p class="halvany">${esc(h.magyarazat)}</p>
              </div>`).join('')}
          </div>` : ''}

          ${(ai.erossegek || []).length ? `
            <h4 style="margin-top:1.2rem;">${t('jav.erossegek')}</h4>
            <ul class="lista-pontok">${ai.erossegek.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
          ${(ai.fejlesztendo || []).length ? `
            <h4 style="margin-top:0.8rem;">${t('jav.fejlesztendo')}</h4>
            <ul class="lista-pontok">${ai.fejlesztendo.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        </div>` : `
        <div class="m-szekcio">
          <p class="halvany">${t('jav.nincs_ai', { statusz: esc(b.statusz) })}</p>
        </div>`}

        <div class="m-szekcio kiemelt">
          <h4>${t('jav.visszajelzes_cim')}</h4>
          <p class="halvany">${t('jav.visszajelzes_leiras')}</p>
          ${pontSorok.length ? `
          <div class="form-group">
            <label>${t('jav.pontozas_label')}</label>
            <div class="tabla-gorgeto">
              <table class="tabla pont-szerk">
                <thead><tr><th>${t('beadas.szempont')}</th><th>${t('beadas.pont')}</th><th>${t('vj.megjegyzes')}</th></tr></thead>
                <tbody>${pontSorok.map((sz) => `
                  <tr data-kulcs="${esc(sz.kulcs)}">
                    <td>${esc(sz.cim)}</td>
                    <td class="pont-cella">
                      <input type="number" class="p-pont" min="0" max="${esc(sz.max)}" step="any"
                             value="${esc(sz.pont)}" aria-label="${esc(t('jav.pont_aria', { cim: sz.cim }))}" /> / ${esc(sz.max)}
                    </td>
                    <td><textarea class="p-megj" rows="2" aria-label="${esc(t('jav.megj_aria', { cim: sz.cim }))}">${esc(sz.megjegyzes || '')}</textarea></td>
                  </tr>`).join('')}</tbody>
                <tfoot><tr><td>${t('vj.osszesen')}</td><td colspan="2"><strong id="p-ossz"></strong></td></tr></tfoot>
              </table>
            </div>
          </div>` : ''}
          <div class="form-group">
            <label for="m-jegy">${t('jav.jegy_label')} <span id="m-jegy-javaslat" class="halvany"></span></label>
            ${jegyMezo}
          </div>
          <div class="form-group">
            <label for="m-szoveg">${t('jav.szoveg_label')}</label>
            <textarea id="m-szoveg" rows="10"></textarea>
          </div>
          <div class="msg" id="m-msg"></div>
          <div class="gomb-sor">
            <button class="btn-primary" id="m-kuld">
              ${b.statusz === 'elkuldve' ? t('jav.kuld_modosit') : t('jav.kuld')}
            </button>
          </div>
        </div>`;

      // Előtöltés: a már jóváhagyott szöveg, különben az AI javaslata
      document.getElementById('m-szoveg').value = tanari?.szoveg || ai?.diak_szoveg || '';
      if (tanari?.jegy != null) document.getElementById('m-jegy').value = String(tanari.jegy);

      // ── Kifejtős: kérdésenkénti javítás, élő pont és jegyjavaslat ──
      // A jegyet csak addig töltjük elő a javaslattal, amíg a tanár nem
      // választott maga – utána az ő döntése marad.
      const jegyEl = document.getElementById('m-jegy');
      let jegyKezzel = tanari?.jegy != null;
      jegyEl.addEventListener('change', () => { jegyKezzel = true; });
      let kf = null;
      if (kifejtosMod && kulcsAdat) {
        try {
          kf = kifejtosJavitas({
            el: document.getElementById('kf-javitas'),
            beadas: b, ai, kulcsAdat, feladat: f, tanari,
            onValtozas: (e) => {
              document.getElementById('kf-ossz').textContent =
                `${t('vj.pont_osszes', { ossz: e.osszpontszam, max: e.max_pontszam })}${e.szazalek != null ? ` · ${e.szazalek}%` : ''}`;
              document.getElementById('m-jegy-javaslat').textContent =
                e.javasolt_jegy != null
                  ? t('jav.javasolt', { jegy: jegyMegjelenit(e.javasolt_jegy, skala.tipus) }) : '';
              if (!jegyKezzel && e.javasolt_jegy != null) jegyEl.value = String(e.javasolt_jegy);
            }
          });
        } catch (err) {
          console.error(err);
          document.getElementById('kf-javitas').innerHTML =
            `<p class="hiba-szoveg">${t('jav.kulcs_hiba', { ok: esc(err.message) })}</p>`;
        }
      }

      // Élő összeg a pontmezőkből – ugyanígy számol a szerver is
      const osszFrissit = () => {
        const ossz = document.getElementById('p-ossz');
        if (!ossz) return;
        let p = 0, max = 0;
        torzs.querySelectorAll('.pont-szerk tbody tr').forEach((tr) => {
          const inp = tr.querySelector('.p-pont');
          p += Number(inp.value) || 0;
          max += Number(inp.max) || 0;
        });
        ossz.textContent = `${t('vj.pont_osszes', { ossz: p, max })}${max ? ` · ${Math.round((p / max) * 100)}%` : ''}`;
        // Jegyjavaslat a feladat skáláján (ugyanúgy, mint a kifejtősnél)
        const javasolt = jegyJavaslat(p, max, skala);
        document.getElementById('m-jegy-javaslat').textContent =
          javasolt != null ? t('jav.javasolt', { jegy: jegyMegjelenit(javasolt, skala.tipus) }) : '';
        if (!jegyKezzel && javasolt != null) jegyEl.value = String(javasolt);
      };
      torzs.querySelectorAll('.p-pont').forEach((i) => i.addEventListener('input', osszFrissit));
      osszFrissit();

      document.getElementById('m-kuld').addEventListener('click', async (ev) => {
        uzenetTorles('m-msg');
        const szoveg = document.getElementById('m-szoveg').value.trim();
        const jegyStr = document.getElementById('m-jegy').value;

        if (!szoveg) { uzenet('m-msg', t('jav.ures_szoveg')); return; }

        const szempontok = [...torzs.querySelectorAll('.pont-szerk tbody tr')].map((tr) => ({
          kulcs: tr.dataset.kulcs,
          pont: tr.querySelector('.p-pont').value,
          megjegyzes: tr.querySelector('.p-megj').value
        }));
        const rossz = szempontok.find((sz, i) => {
          const inp = torzs.querySelectorAll('.p-pont')[i];
          return sz.pont === '' || !inp.checkValidity();
        });
        if (rossz) {
          uzenet('m-msg', t('jav.pont_hatar'));
          return;
        }

        if (kifejtosMod && !kf) {
          uzenet('m-msg', t('jav.kulcs_nelkul'));
          return;
        }

        const vissza = gombVar(ev.target, t('jav.kuldes_folyamat'));
        try {
          await visszajelzesJovahagyas({
            beadasId,
            jegy: jegyErtek(jegyStr),
            szoveg,
            // Kifejtősnél csak a tanár döntései mennek – a pontot a szerver
            // számolja a kulcsból, ugyanazzal a függvénnyel.
            ...(kf
              ? { kerdesek: kf.modositasok() }
              : { szempontok: szempontok.map((sz) => ({ ...sz, pont: Number(sz.pont) })) })
          });
          uzenet('m-msg', t('jav.elkuldve'), 'success');
        } catch (err) {
          uzenet('m-msg', hibaSzoveg(err));
        } finally {
          vissza();
        }
      });

    } catch (e) {
      console.error(e);
      torzs.innerHTML = `<p>${t('jav.modal_hiba', { ok: esc(e.message) })}</p>`;
    }
  }
</script>
</body>
</html>
